name: SET Factsheet Scraper

on:
  # รันอัตโนมัติตามเวลาที่กำหนด (เวลาใน GitHub Actions เป็น UTC = เวลาไทย - 7 ชม.)
  schedule:
    # = 20:13 UTC ของวันอาทิตย์-ศุกร์
    # ดังนั้น 0-5 UTC → จะได้ จันทร์-เสาร์ เวลา 03:13 ไทย พอดี
    - cron: '13 20 * * 0-5'
  
  # กดสั่งรันเองได้จากหน้า GitHub Actions (พร้อมตัวเลือกสำหรับทดสอบ)
  workflow_dispatch:
    inputs:
      test_stocks:
        description: 'หุ้นสำหรับทดสอบ (คั่นด้วย , เช่น ADVANC,PTT — เว้นว่างเพื่อดึงทั้งหมด)'
        required: false
        default: ''
        type: string
      max_workers:
        description: 'จำนวน Chrome workers ต่อเครื่อง (แนะนำ 2-3 เพื่อไม่ให้โดน Rate Limit)'
        required: false
        default: '3'
        type: string

# สิทธิ์ในการ commit และ push ไฟล์ CSV กลับเข้า repository
permissions:
  contents: write

# ป้องกันไม่ให้รันซ้อนกัน
concurrency:
  group: set-factsheet-scraper
  cancel-in-progress: false

jobs:
  # ==========================================
  # MODE 1: TEST MODE (ทำงานเมื่อกรอก test_stocks)
  # ==========================================
  test-run:
    if: ${{ inputs.test_stocks != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify Chrome & ChromeDriver compatibility
        run: |
          CHROME_VER=$(google-chrome --version 2>/dev/null | grep -oE '[0-9]+' | head -n1 || true)
          DRIVER_PATH=$(command -v chromedriver || true)
          DRIVER_VER=$(chromedriver --version 2>/dev/null | grep -oE '[0-9]+' | head -n1 || true)
          echo "Chrome major version: ${CHROME_VER:-not found}"
          echo "ChromeDriver major version: ${DRIVER_VER:-not found} (${DRIVER_PATH:-none})"
          if [ -n "$DRIVER_PATH" ] && [ "$CHROME_VER" != "$DRIVER_VER" ]; then
            echo "⚠️ Version mismatch — removing $DRIVER_PATH so Selenium Manager downloads the matching version"
            sudo rm -f "$DRIVER_PATH"
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SET scraper (Test Mode)
        env:
          PYTHONUNBUFFERED: '1'
          MAX_WORKERS: ${{ inputs.max_workers || '3' }}
          TEST_STOCKS: ${{ inputs.test_stocks }}
        run: python set.py

      - name: Upload test output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: set-test-output
          path: |
            data_factsheet/
            listedCompanies_th_TH.csv
          retention-days: 7

  # ==========================================
  # MODE 2: FULL RUN แบบ Matrix 5 เครื่องพร้อมกัน (~5-8 นาที)
  # ==========================================
  scrape-matrix:
    if: ${{ inputs.test_stocks == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # แบ่ง 9 กลุ่มเป็น 5 ก้อนที่มีจำนวนหุ้นใกล้เคียงกัน (~150-212 หุ้น/เครื่อง)
        include:
          - name: propcon
            sectors: 'PROPCON'
          - name: service
            sectors: 'SERVICE'
          - name: indus
            sectors: 'INDUS'
          - name: agro-fincial
            sectors: 'AGRO,FINCIAL'
          - name: consump-resourc-tech
            sectors: 'CONSUMP,RESOURC,TECH,-'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify Chrome & ChromeDriver compatibility
        run: |
          CHROME_VER=$(google-chrome --version 2>/dev/null | grep -oE '[0-9]+' | head -n1 || true)
          DRIVER_PATH=$(command -v chromedriver || true)
          DRIVER_VER=$(chromedriver --version 2>/dev/null | grep -oE '[0-9]+' | head -n1 || true)
          echo "Chrome major version: ${CHROME_VER:-not found}"
          echo "ChromeDriver major version: ${DRIVER_VER:-not found} (${DRIVER_PATH:-none})"
          if [ -n "$DRIVER_PATH" ] && [ "$CHROME_VER" != "$DRIVER_VER" ]; then
            echo "⚠️ Version mismatch — removing $DRIVER_PATH so Selenium Manager downloads the matching version"
            sudo rm -f "$DRIVER_PATH"
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SET scraper (${{ matrix.sectors }})
        env:
          PYTHONUNBUFFERED: '1'
          MAX_WORKERS: ${{ inputs.max_workers || '3' }}
          SECTORS: ${{ matrix.sectors }}
        run: python set.py

      - name: Upload sector CSVs
        uses: actions/upload-artifact@v4
        with:
          name: factsheet-${{ matrix.name }}
          path: |
            data_factsheet/*.csv
            listedCompanies_th_TH.csv
          retention-days: 1

  # ==========================================
  # รวมไฟล์จากทั้ง 5 เครื่องแล้ว Commit & Push ครั้งเดียว
  # ==========================================
  merge-and-commit:
    if: ${{ inputs.test_stocks == '' }}
    needs: scrape-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all sector CSVs
        uses: actions/download-artifact@v4
        with:
          pattern: factsheet-*
          merge-multiple: true
          path: _artifacts

      - name: Assemble updated CSV files
        run: |
          rm -rf data_factsheet
          mkdir -p data_factsheet
          cp -f _artifacts/data_factsheet/*.csv data_factsheet/
          cp -f _artifacts/listedCompanies_th_TH.csv ./listedCompanies_th_TH.csv
          rm -rf _artifacts
          ls -lh data_factsheet/ listedCompanies_th_TH.csv

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # ใช้ -f เพื่อให้เพิ่มไฟล์ได้แม้ .gitignore จะ ignore โฟลเดอร์ data_factsheet/ ไว้
          git add -f -A data_factsheet/ listedCompanies_th_TH.csv

          if git diff --staged --quiet; then
            echo "ℹ️ ไม่มีข้อมูลเปลี่ยนแปลง ข้ามการ commit"
          else
            TIMESTAMP=$(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M ICT')
            git commit -m "chore: update SET factsheet data (${TIMESTAMP})"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
